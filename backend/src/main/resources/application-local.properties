spring.application.name=notify

# H2 embedded for local dev
spring.datasource.url=jdbc:h2:mem:notify;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# Disable Kafka for local dev
notify.kafka.enabled=false

# Disable DB routing for local dev (single H2)
notify.datasource.routing-enabled=false

# Redis auto-config will fail without server; disable it
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

notify.deduplication.default-window=10s
notify.window.default-size=5m
notify.window.default-shard-size=10s
