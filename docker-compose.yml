services:
  # ── PostgreSQL: primary + replica ──
  postgres-primary:
    image: postgres:16
    environment:
      POSTGRES_DB: notify
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/pg-primary-init.sh:/docker-entrypoint-initdb.d/01-replication.sh:ro
    command: >
      postgres
        -c wal_level=replica
        -c max_wal_senders=5
        -c max_replication_slots=5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify -d notify"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-replica:
    image: postgres:16
    depends_on:
      postgres-primary:
        condition: service_healthy
    ports:
      - "5433:5432"
    environment:
      PGUSER: replication
      PGPASSWORD: notify
    entrypoint: []
    command: >
      bash -c "
        rm -rf /var/lib/postgresql/data/*
        until pg_isready -h postgres-primary -p 5432 -U notify -d notify; do sleep 1; done
        pg_basebackup -h postgres-primary -U replication -D /var/lib/postgresql/data -Fp -Xs -P -R
        echo 'hot_standby = on' >> /var/lib/postgresql/data/postgresql.auto.conf
        exec docker-entrypoint.sh postgres
      "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U notify -d notify"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Redis Cluster: 3 masters ──
  redis-node-1:
    image: redis:7-alpine
    ports:
      - "6379:6379"
      - "16379:16379"
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-node-2:
    image: redis:7-alpine
    ports:
      - "6380:6379"
      - "16380:16379"
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-node-3:
    image: redis:7-alpine
    ports:
      - "6381:6379"
      - "16381:16379"
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-cluster-init:
    image: redis:7-alpine
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
    entrypoint: []
    command: ["sh", "-c", "redis-cli --cluster create redis-node-1:6379 redis-node-2:6379 redis-node-3:6379 --cluster-replicas 0 --cluster-yes"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h redis-node-1 -p 6379 cluster info | grep -q 'cluster_state:ok'"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Kafka: single broker ──
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep -q imok"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-topics:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic user-operation-events --partitions 24 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic notification-events --partitions 24 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic user-operation-events-dlt --partitions 6 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic notification-events-dlt --partitions 6 --replication-factor 1"

  # ── Backend ──
  backend:
    image: eclipse-temurin:21-jdk
    working_dir: /app
    volumes:
      - ./backend:/app
    command: java -jar build/libs/notify-0.0.1-SNAPSHOT.jar
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      redis-cluster-init:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
    environment:
      NOTIFY_DB_ROUTING_ENABLED: "true"
      NOTIFY_DB_WRITE_URL: jdbc:postgresql://postgres-primary:5432/notify
      NOTIFY_DB_READ_URL: jdbc:postgresql://postgres-replica:5432/notify
      NOTIFY_DB_USERNAME: notify
      NOTIFY_DB_PASSWORD: notify
      NOTIFY_KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_CLUSTER_NODES: redis-node-1:6379,redis-node-2:6379,redis-node-3:6379
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ── Frontend ──
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    command: sh -c "npm install --ignore-scripts && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
